<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>مِسْبَحَة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="./fonts/fonts.css?v=3">
<style>
html, body { margin: 0; min-height: 100%; }
body { background: #081820; }

.misbaha {
    --bg-deep: #081820;
    --bg: #0b2129;
    --bg-card: #102b33;
    --gold: #c9a24b;
    --gold-hi: #f0d78c;
    --cream: #f3ead3;
    --cream-dim: rgba(243, 234, 211, .55);
    --gold-lo: #7a5f21;
    --glow1: #12333d;
    --glow2: #0e2c33;
    --btn-bg: rgba(16, 43, 51, .7);
    --btn-bg-soft: rgba(16, 43, 51, .55);
    --card-bg: rgba(16, 43, 51, .6);
    --sel-bg: rgba(29, 74, 84, .6);
    --pad-hi: #17414d;
    --pad-lo: #0a2028;
    --sheet-1: #12313a;
    --sheet-2: #0b2129;
    --backdrop: rgba(3, 10, 13, .6);
    --faint: rgba(243, 234, 211, .35);
    --scheme: dark;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    position: fixed;
    inset: 0;
    z-index: 10;
    font-family: 'Tajawal', system-ui, sans-serif;
    color: var(--cream);
    background:
        radial-gradient(1200px 800px at 50% -10%, var(--glow1) 0%, transparent 60%),
        radial-gradient(900px 700px at 50% 115%, var(--glow2) 0%, transparent 55%),
        var(--bg-deep);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overscroll-behavior: none;
}
.app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    box-sizing: border-box;
    padding: calc(10px + var(--safe-top)) 18px calc(10px + var(--safe-bottom));
}

header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { display: flex; align-items: center; gap: 9px; }
.brand .dot {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
    box-shadow: 0 0 18px rgba(201, 162, 75, .35), inset 0 0 6px rgba(0, 0, 0, .25);
}
.brand h1 {
    margin: 0;
    font-family: 'Amiri', serif;
    font-size: 24px; font-weight: 700;
    color: var(--gold-hi); letter-spacing: .5px;
}
.icon-btn {
    width: 40px; height: 40px; border-radius: 14px;
    border: 1px solid rgba(201, 162, 75, .25);
    background: var(--btn-bg);
    color: var(--cream-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform .08s ease, color .2s, border-color .2s;
    flex: none;
    font: inherit;
    position: relative;
}
.icon-btn:active { transform: scale(.92); }
.icon-btn.gold {
    background: linear-gradient(135deg, #f0d78c, #c9a24b);
    border-color: var(--gold);
    color: #201a0b;
    box-shadow: 0 3px 14px rgba(201, 162, 75, .35);
}
.icon-btn.on { color: var(--gold-hi); border-color: var(--gold); }
.icon-btn svg { width: 20px; height: 20px; }

/* dhikr card */
.dhikr-zone { margin-top: 8px; text-align: center; min-height: 72px; display: flex; flex-direction: column; justify-content: center; }
.dhikr-text {
    font-family: 'Amiri', serif;
    font-size: 28px; line-height: 1.5;
    color: var(--cream);
    text-shadow: 0 2px 18px rgba(0, 0, 0, .35);
}
.dhikr-switch {
    margin-top: 8px; font-size: 14px; font-weight: 700; color: var(--gold-hi);
    background: rgba(201, 162, 75, .14);
    border: 1px solid var(--gold);
    border-radius: 999px;
    box-shadow: 0 3px 14px rgba(201, 162, 75, .22), inset 0 1px 8px rgba(240, 215, 140, .08);
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; align-self: center;
    padding: 9px 20px;
    min-height: 44px;
    transition: transform .08s ease;
}
.dhikr-switch:active { transform: scale(.96); background: rgba(201, 162, 75, .25); }
.dhikr-switch svg { width: 15px; height: 15px; }

/* open-in-telegram: gold pill, visible only outside Telegram */
.tg-open {
    display: none; align-items: center; justify-content: center; gap: 7px;
    margin: 10px auto 0; width: fit-content;
    font-family: 'Tajawal', sans-serif; font-size: 14px; font-weight: 700; color: #1b1405;
    background: linear-gradient(135deg, #f0d78c, #c9a24b);
    border: 1px solid #c9a24b; border-radius: 999px;
    box-shadow: 0 3px 14px rgba(201, 162, 75, .30);
    padding: 8px 18px; min-height: 40px; box-sizing: border-box;
    text-decoration: none; cursor: pointer;
    transition: transform .08s ease;
}
.tg-open:active { transform: scale(.96); }
.tg-open svg { width: 15px; height: 15px; }
.misbaha.no-tg .tg-open { display: inline-flex; }

/* target chips */
.targets { display: flex; justify-content: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.chip {
    font-family: 'Tajawal', sans-serif;
    font-size: 13.5px; font-weight: 500; color: var(--cream-dim);
    background: var(--btn-bg-soft);
    border: 1px solid rgba(201, 162, 75, .18);
    padding: 6px 15px; border-radius: 999px;
    cursor: pointer; transition: all .15s;
    font-variant-numeric: tabular-nums;
}
.chip.active {
    color: #1b1405;
    background: linear-gradient(135deg, var(--gold-hi), var(--gold));
    border-color: var(--gold); font-weight: 700;
    box-shadow: 0 3px 14px rgba(201, 162, 75, .30);
}

/* the counter */
.counter-wrap { display: flex; align-items: center; justify-content: center; margin: 14px 0 10px; flex: 1; }
.counter {
    position: relative;
    width: min(68vw, 290px); aspect-ratio: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    outline: none;
}
.ring-bg, .ring-fg { position: absolute; inset: 0; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring-bg circle { fill: none; stroke: rgba(201, 162, 75, .14); stroke-width: 7; }
.ring-fg circle {
    fill: none; stroke: url(#goldgrad); stroke-width: 7; stroke-linecap: round;
    transition: stroke-dashoffset .18s ease-out;
    filter: drop-shadow(0 0 6px rgba(201, 162, 75, .55));
}
.pad {
    position: absolute; inset: 9.5%; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, var(--pad-hi) 0%, var(--bg-card) 52%, var(--pad-lo) 100%);
    border: 1px solid rgba(201, 162, 75, .22);
    box-shadow: 0 18px 45px rgba(0, 0, 0, .5), inset 0 2px 14px rgba(240, 215, 140, .06), inset 0 -10px 26px rgba(0, 0, 0, .35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .07s ease;
}
.counter.pressed .pad { transform: scale(.965); }
.count {
    font-family: 'Tajawal', sans-serif;
    font-weight: 800; font-variant-numeric: tabular-nums;
    font-size: clamp(48px, 17vw, 76px); line-height: 1;
    color: var(--gold-hi);
    text-shadow: 0 0 26px rgba(201, 162, 75, .35);
}
.pad .hint { font-size: 13px; color: var(--cream-dim); margin-top: 4px; }
.pad .rounds { font-size: 13.5px; color: var(--gold); font-weight: 500; min-height: 18px; font-variant-numeric: tabular-nums; }
.counter.complete .pad { animation: glow .9s ease; }
@keyframes glow {
    0% { box-shadow: 0 18px 45px rgba(0, 0, 0, .5), 0 0 0 rgba(240, 215, 140, 0); }
    35% { box-shadow: 0 18px 45px rgba(0, 0, 0, .5), 0 0 60px rgba(240, 215, 140, .55); }
    100% { box-shadow: 0 18px 45px rgba(0, 0, 0, .5), 0 0 0 rgba(240, 215, 140, 0); }
}
.blessing {
    position: absolute; top: -34px; left: 50%;
    transform: translateX(-50%) translateY(6px);
    font-family: 'Amiri', serif; font-size: 21px; color: var(--gold-hi);
    opacity: 0; pointer-events: none; white-space: nowrap;
    transition: opacity .35s, transform .35s;
}
.blessing.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* bottom controls */
.controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; }
.stats { display: flex; gap: 16px; justify-content: center; margin-top: 4px; padding-bottom: 2px; }
.stat { text-align: center; }
.stat b { display: block; font-size: 19px; font-weight: 800; color: var(--cream); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--cream-dim); }
.btn-label { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--cream-dim); }
.reset-hold { position: relative; overflow: hidden; }
.reset-hold .fill {
    position: absolute; inset: 0;
    background: rgba(220, 80, 70, .35);
    transform: scaleX(0); transform-origin: right;
    pointer-events: none;
}
.save-note {
    text-align: center;
    font-size: 10.5px;
    color: var(--faint);
    padding-top: 4px;
    min-height: 13px;
}

/* dhikr sheet */
.sheet-backdrop {
    position: fixed; inset: 0;
    background: var(--backdrop);
    backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 20;
}
.sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: linear-gradient(180deg, var(--sheet-1), var(--sheet-2));
    border-radius: 22px 22px 0 0;
    border-top: 1px solid rgba(201, 162, 75, .3);
    padding: 14px 18px calc(18px + var(--safe-bottom));
    transform: translateY(105%);
    transition: transform .3s cubic-bezier(.2, .8, .25, 1);
    max-height: 62%; display: flex; flex-direction: column;
}
.misbaha.sheet-open .sheet { transform: translateY(0); }
.misbaha.sheet-open .sheet-backdrop { opacity: 1; pointer-events: auto; }
.sheet h2 {
    margin: 0 0 10px;
    font-family: 'Amiri', serif; font-size: 20px; color: var(--gold-hi); text-align: center;
}
.dhikr-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.dhikr-item {
    font-family: 'Amiri', serif;
    font-size: 21px; line-height: 1.7; color: var(--cream);
    background: var(--btn-bg-soft);
    border: 1px solid rgba(201, 162, 75, .16);
    border-radius: 14px; padding: 10px 14px;
    text-align: center; cursor: pointer;
    transition: border-color .15s;
}
.dhikr-item:active, .dhikr-item.sel { border-color: var(--gold); background: var(--sel-bg); }
.dhikr-actions {display:flex;align-items:center;justify-content:center;gap:10px}
.dhikr-actions .dhikr-switch {padding:9px 14px}
.reminder-entry {background:linear-gradient(135deg,#f0d78c,#c9a24b);color:#201a0b}
.reminder-entry svg {width:18px;height:18px}
/* Reminders use the same compact bottom-sheet language. */
.reminder-backdrop {position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(3px);z-index:24;display:none}
.reminder-sheet {position:fixed;bottom:0;left:0;right:0;z-index:25;background:linear-gradient(180deg,var(--sheet-1),var(--sheet-2));border-radius:22px 22px 0 0;border-top:1px solid #c9a24b66;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:72%;overflow:auto;display:none;color:var(--cream);box-sizing:border-box}
.reminder-open .reminder-sheet,.reminder-open .reminder-backdrop {display:block}
.reminder-title {display:flex;align-items:center;justify-content:space-between;gap:12px}
.reminder-title h2 {font-family:Amiri,serif;color:var(--gold-hi);font-size:24px;margin:0}
.reminder-sheet p {font-size:13px;line-height:1.7;margin:9px 0;color:var(--cream-dim)}
.reminder-sheet label {display:block;font-size:14px;margin:10px 0 6px}
.reminder-sheet input,.reminder-sheet select {box-sizing:border-box;display:block;width:100%;background:var(--bg);color:var(--cream);border:1px solid #c9a24b66;border-radius:12px;padding:12px;font:inherit;font-size:16px;min-height:46px;color-scheme:var(--scheme)}
.reminder-sheet select {font-family:Amiri,serif}
.reminder-sheet .reminder-submit {width:100%;justify-content:center;margin-top:14px}
.reminder-row {display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #c9a24b33}
.reminder-row b {display:block;color:var(--gold-hi);font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.reminder-row span,.reminder-row small {display:block;font-size:14px;line-height:1.6}
.reminder-row span {font-family:Amiri,serif}
button:disabled {opacity:.5;cursor:wait}
@media(max-width:350px){header .brand h1{font-size:21px}header .brand{gap:5px}header .brand .dot{width:27px;height:27px}header .icon-btn{width:35px;height:35px}header>div:last-child{gap:5px!important}}

.sound-backdrop {position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(3px);z-index:28;display:none}
.sound-sheet {position:fixed;bottom:0;left:0;right:0;z-index:29;background:linear-gradient(180deg,var(--sheet-1),var(--sheet-2));border-radius:22px 22px 0 0;border-top:1px solid #c9a24b66;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:none;color:var(--cream)}
.sound-open .sound-sheet,.sound-open .sound-backdrop {display:block}
.sound-options {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sound-option {border:1px solid #c9a24b44;background:var(--bg);color:var(--cream);border-radius:14px;padding:16px 12px;min-height:64px;font:inherit;cursor:pointer}
.sound-option[aria-checked=true] {border-color:var(--gold-hi);background:#c9a24b1c;color:var(--gold-hi);box-shadow:inset 0 0 0 1px #c9a24b33}
.sound-option,.icon-btn {-webkit-tap-highlight-color:transparent}
.sound-option svg {width:22px;height:22px;vertical-align:middle;margin-left:9px}

/* stats page «سجلّي» */
.stats-page {
    position: fixed; inset: 0; z-index: 40;
    background:
        radial-gradient(1200px 800px at 50% -10%, var(--glow1) 0%, transparent 60%),
        radial-gradient(900px 700px at 50% 115%, var(--glow2) 0%, transparent 55%),
        var(--bg-deep);
    display: flex; flex-direction: column;
    padding: calc(10px + var(--safe-top)) 18px calc(12px + var(--safe-bottom));
    box-sizing: border-box;
    transform: translateY(103%);
    visibility: hidden;
    transition: transform .32s cubic-bezier(.2, .8, .25, 1), visibility 0s linear .32s;
}
.misbaha.stats-open .stats-page {
    transform: translateY(0);
    visibility: visible;
    transition: transform .32s cubic-bezier(.2, .8, .25, 1);
}
.stats-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stats-head h2 {
    margin: 0; font-family: 'Amiri', serif; font-size: 26px; font-weight: 700;
    color: var(--gold-hi); letter-spacing: .5px;
}
.stats-body { overflow-y: auto; margin-top: 14px; padding-bottom: 8px; flex: 1; }
.stats-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.scard {
    background: var(--card-bg);
    border: 1px solid rgba(201, 162, 75, .2);
    border-radius: 14px; padding: 12px 4px 10px;
    text-align: center;
}
.scard b {
    display: block; font-size: 20px; font-weight: 800; color: var(--gold-hi);
    font-variant-numeric: tabular-nums; line-height: 1.2;
    text-shadow: 0 0 14px rgba(201, 162, 75, .3);
}
.scard span { display: block; font-size: 11.5px; color: var(--cream-dim); margin-top: 3px; }
.streak-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding: 12px 16px;
    background: rgba(201, 162, 75, .1);
    border: 1px solid rgba(201, 162, 75, .3);
    border-radius: 14px;
    font-size: 14.5px; font-weight: 700; color: var(--cream);
}
.streak-row b {
    font-size: 20px; color: var(--gold-hi); font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 6px;
}
.streak-row b svg { width: 18px; height: 18px; }
.chart-box {
    margin-top: 10px; padding: 14px 14px 10px;
    background: var(--card-bg);
    border: 1px solid rgba(201, 162, 75, .2);
    border-radius: 14px;
}
.chart-box .chart-title { font-size: 12.5px; color: var(--cream-dim); margin-bottom: 10px; display: flex; justify-content: space-between; }
.chart-box .chart-title b { color: var(--gold); font-weight: 700; }
.month-chart { display: flex; align-items: flex-end; gap: 3px; height: 72px; direction: ltr; }
.month-chart .bar {
    flex: 1; min-width: 3px; border-radius: 3px 3px 1px 1px;
    background: rgba(201, 162, 75, .28);
    min-height: 3px;
    transition: height .3s ease;
}
.month-chart .bar.has { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); }
.month-chart .bar.now { box-shadow: 0 0 10px rgba(240, 215, 140, .65); border: 1px solid var(--gold-hi); }
.sessions-title {
    margin: 16px 0 8px; font-family: 'Amiri', serif; font-size: 20px; color: var(--gold-hi);
}
.day-head {
    font-size: 12px; font-weight: 700; color: var(--gold);
    margin: 12px 2px 6px;
}
.session-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--btn-bg-soft);
    border: 1px solid rgba(201, 162, 75, .14);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 6px;
}
.session-row .s-dhikr {
    flex: 1; min-width: 0;
    font-family: 'Amiri', serif; font-size: 17.5px; color: var(--cream);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-row .s-meta { text-align: left; flex: none; }
.session-row .s-n { display: block; font-weight: 800; font-size: 16px; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.session-row .s-t { display: block; font-size: 11px; color: var(--cream-dim); font-variant-numeric: tabular-nums; }
.session-row.live { border-color: rgba(201, 162, 75, .5); }
.session-row.live .s-t { color: var(--gold); font-weight: 700; }
.sessions-empty { font-size: 13.5px; color: var(--cream-dim); text-align: center; padding: 18px 0 6px; }
/* light theme: cream and gold, same identity */
body.theme-light { background: #f4ecd7; }
.misbaha.light {
    --bg-deep: #f4ecd7;
    --bg: #faf4e4;
    --bg-card: #fffdf4;
    --gold: #a5832c;
    --gold-hi: #7c621f;
    --gold-lo: #8a6d1f;
    --cream: #2b3a41;
    --cream-dim: rgba(43, 58, 65, .62);
    --glow1: #fffaf0;
    --glow2: #f3e7c8;
    --btn-bg: rgba(255, 253, 245, .78);
    --btn-bg-soft: rgba(255, 253, 245, .66);
    --card-bg: rgba(255, 253, 245, .8);
    --sel-bg: rgba(201, 162, 75, .2);
    --pad-hi: #fffef8;
    --pad-lo: #f2e5c6;
    --sheet-1: #fdf8ea;
    --sheet-2: #f6eeda;
    --backdrop: rgba(59, 48, 21, .38);
    --faint: rgba(43, 58, 65, .45);
    --scheme: light;
}
.misbaha.light .brand .dot { background: radial-gradient(circle at 32% 30%, #f0d78c, #c9a24b 55%, #7a5f21); }
.misbaha.light .dhikr-text { text-shadow: 0 1px 12px rgba(255, 255, 255, .55); }
.misbaha.light .pad { box-shadow: 0 18px 40px rgba(124, 98, 31, .22), inset 0 2px 14px rgba(255, 255, 255, .5), inset 0 -10px 26px rgba(124, 98, 31, .12); }
.misbaha.light .ring-bg circle { stroke: rgba(169, 131, 44, .28); }
.misbaha.light .chip.active { background: linear-gradient(135deg, #f0d78c, #c9a24b); color: #1b1405; }
.misbaha.light .month-chart .bar.has { background: linear-gradient(180deg, #e9c96f, #c9a24b); }
.misbaha.light .counter.complete .pad { animation: glow-light .9s ease; }
@keyframes glow-light {
    0% { box-shadow: 0 18px 40px rgba(124, 98, 31, .22), 0 0 0 rgba(201, 162, 75, 0); }
    35% { box-shadow: 0 18px 40px rgba(124, 98, 31, .22), 0 0 60px rgba(201, 162, 75, .65); }
    100% { box-shadow: 0 18px 40px rgba(124, 98, 31, .22), 0 0 0 rgba(201, 162, 75, 0); }
}
#btn-theme .icon-sun { display: none; }
.misbaha.light #btn-theme .icon-sun { display: block; }
.misbaha.light #btn-theme .icon-moon { display: none; }

@media (max-width: 350px) {
    .scard b { font-size: 17px; }
    .scard span { font-size: 10.5px; }
    .stats-head h2 { font-size: 23px; }
}
</style>
</head>
<body>
<div dir="rtl" lang="ar" class="misbaha" id="root">
    <div class="app">
        <header>
            <div class="brand"><div class="dot"></div><h1>مِسْبَحَة</h1></div>

                var head = document.createElement('div');
                head.className = 'day-head';
                head.textContent = k === todayK ? 'اليوم' : (k === yestK ? 'أمس' : (fmtDay ? fmtDay.format(new Date(r[2])) : k));
                list.appendChild(head);
            }
            var row = document.createElement('div');
            row.className = 'session-row' + (isLive ? ' live' : '');
            var dz = document.createElement('div');
            dz.className = 's-dhikr';
            dz.textContent = ADHKAR[r[0]] || ADHKAR[0];
            var meta = document.createElement('div');
            meta.className = 's-meta';
            var nEl = document.createElement('span');
            nEl.className = 's-n';
            nEl.textContent = String(r[1]);
            var tEl = document.createElement('span');
            tEl.className = 's-t';
            tEl.textContent = isLive ? 'الآن' : (fmtTime ? fmtTime.format(new Date(r[2])) : '');
            meta.appendChild(nEl); meta.appendChild(tEl);
            row.appendChild(dz); row.appendChild(meta);
            list.appendChild(row);
        }
    }

    // stats page open/close
    function openStats() {
        if (!ready) return;
        renderStats();
        rootEl.classList.add('stats-open');
        $('stats-page').setAttribute('aria-hidden', 'false');
    }
    function closeStats() {
        rootEl.classList.remove('stats-open');
        $('stats-page').setAttribute('aria-hidden', 'true');
    }
    $('btn-stats').addEventListener('click', openStats);
    $('stats-close').addEventListener('click', closeStats);

    // ---- interactions ----
    var lastTap = 0, pressTimer = null;
    function tap() {
        if (!ready) return;
        var now = performance.now();
        if (now - lastTap < 45) return;
        lastTap = now;
        var base = rebaseToToday(state);
        var next = base.count + 1;
        counterEl.classList.add('pressed');
        setTimeout(function () { counterEl.classList.remove('pressed'); }, 80);
        if (base.target > 0 && next >= base.target) {
            logSession(base.dhikr, base.target);
            setState(Object.assign(base, { count: 0, round: base.round + 1, total: base.total + 1, today: base.today + 1 }));
            buzz('success');
            blessingEl.textContent = 'تَقَبَّلَ اللَّهُ ✦';
            blessingEl.classList.add('show');
            counterEl.classList.add('complete');
            setTimeout(function () { blessingEl.classList.remove('show'); counterEl.classList.remove('complete'); }, 1400);
        } else {
            setState(Object.assign(base, { count: next, total: base.total + 1, today: base.today + 1 }));
            buzz('tap');
        }
    }
    // Sound fires on pointerdown, together with the count. Only if the browser refuses
    // playback outside a "finished" gesture (soundBlocked) does touchend/click take over.
    var soundDoneForTap = false;
    counterEl.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        initAudio();
        soundDoneForTap = false;
        if (!soundBlocked) soundDoneForTap = clickSound();
        tap();
    });
    counterEl.addEventListener('touchend', function () {
        initAudio(); resumeAudio();
        unlockPool();
        if (!soundDoneForTap || soundBlocked) { soundBlocked = false; clickSound(); }
        soundDoneForTap = true;
    }, { passive: true });
    counterEl.addEventListener('click', function () { initAudio(); unlockPool(); });

    $('btn-minus').addEventListener('click', function () {
        if (!ready || state.count <= 0) return;
        update({ count: state.count - 1, total: Math.max(0, state.total - 1), today: Math.max(0, state.today - 1) });
        buzz('tap');
    });

    // long-press reset
    var holdTimer = null;
    function startHold(e) {
        e.preventDefault();
        var started = performance.now();
        if (holdTimer) clearInterval(holdTimer);
        holdTimer = setInterval(function () {
            var p = Math.min((performance.now() - started) / 900, 1);
            resetFillEl.style.transform = 'scaleX(' + p + ')';
            if (p >= 1) {
                clearInterval(holdTimer); holdTimer = null;
                resetFillEl.style.transform = 'scaleX(0)';
                logSession(state.dhikr, state.count);
                update({ count: 0, round: 1 });
                buzz('warn');
            }
        }, 30);
    }
    function endHold() {
        if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
        resetFillEl.style.transform = 'scaleX(0)';
    }
    var resetBtn = $('btn-reset');
    resetBtn.addEventListener('pointerdown', startHold);
    resetBtn.addEventListener('pointerup', endHold);
    resetBtn.addEventListener('pointerleave', endHold);
    resetBtn.addEventListener('pointercancel', endHold);

    // share
    $('btn-share').addEventListener('click', function () {
        var data = { title: 'مِسْبَحَة', text: 'مسبحة إلكترونية لعدّ الاستغفار والأذكار:', url: location.href };
        if (navigator.share) {
            navigator.share(data).catch(function () {});
        } else if (navigator.clipboard) {
            navigator.clipboard.writeText(location.href).then(function () {
                blessingEl.textContent = 'نُسِخَ الرابط';
                blessingEl.classList.add('show');
                setTimeout(function () { blessingEl.classList.remove('show'); }, 1300);
            }).catch(function () {});
        }
    });

    // toggles
    $('btn-vib').addEventListener('click', function () {
        update({ vib: !state.vib });
        if (!state.vib) { try { if (navigator.vibrate) navigator.vibrate(20); } catch (e) {} }
    });
    function closeSound() { rootEl.classList.remove('sound-open'); $('sound-sheet').setAttribute('aria-hidden','true'); $('btn-snd').focus(); }
    $('btn-snd').addEventListener('click', function () { if (!ready) return; rootEl.classList.add('sound-open'); $('sound-sheet').setAttribute('aria-hidden','false'); });
    $('sound-close').addEventListener('click', closeSound);
    $('sound-backdrop').addEventListener('click', closeSound);
    document.addEventListener('keydown', function(e) { if(e.key==='Escape' && rootEl.classList.contains('sound-open')) closeSound(); });
    document.addEventListener('keydown', function(e) { if(e.key==='Escape' && rootEl.classList.contains('stats-open')) closeStats(); });
    Array.from(document.querySelectorAll('[data-sound]')).forEach(function (b) {
        b.addEventListener('click', function () {
            soundChoice = b.getAttribute('data-sound');
            try { localStorage.setItem('misbaha.sound.v1', soundChoice); } catch (e) {}
            setTone(soundChoice);
            initAudio();
            unlocked = false;
            update({ snd: soundChoice !== 'off' });
            if (state.snd) clickSound();
            setTimeout(unlockPool, 400);
        });
    });

    // target chips
    TARGETS.forEach(function (t) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'chip';
        b.textContent = t === 0 ? 'بلا هدف' : String(t);
        b.addEventListener('click', function () { if (ready && state.count > 0) logSession(state.dhikr, state.count); update({ target: t, count: 0, round: 1 }); buzz('tap'); });
        $('targets').appendChild(b);
    });

    // dhikr sheet
    ADHKAR.forEach(function (d, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'dhikr-item';
        b.textContent = d;
        b.addEventListener('click', function () {
            if (ready && state.count > 0) logSession(state.dhikr, state.count);
            update({ dhikr: i, count: 0, round: 1 });
            rootEl.classList.remove('sheet-open');
            buzz('tap');
        });
        $('dhikr-list').appendChild(b);
    });
    $('btn-dhikr').addEventListener('click', function () { rootEl.classList.add('sheet-open'); });
    $('sheet-backdrop').addEventListener('click', function () { rootEl.classList.remove('sheet-open'); });

    // day rollover while open / on return
    function rebaseNow() {
        if (!ready) return;
        var r = rebaseToToday(state);
        if (r !== state) setState(r);
    }
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') rebaseNow(); });
    window.addEventListener('focus', rebaseNow);
    setInterval(rebaseNow, 30000);

    // keep screen awake while counting (best effort)
    var wakeLock = null;
    function reqWake() {
        if (!wakeLock && navigator.wakeLock) {
            navigator.wakeLock.request('screen').then(function (w) { wakeLock = w; }).catch(function () {});
        }
    }
    document.addEventListener('pointerdown', reqWake);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reqWake(); });

    // ---- boot ----
    loadStored(function (stored) {
        state = rebaseToToday(Object.assign({}, initialCounter, stored || {}));
        if (!soundChoice) soundChoice = state.snd ? 'soft' : 'off';
        state.snd = soundChoice !== 'off';
        setTone(soundChoice);
        ready = true;
        persist();
        render();
    });
})();
</script>
<script src="./reminders.js?v=2"></script>
</body>
